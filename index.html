<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <link rel="icon" href="https://www.instagram.com/static/images/ico/favicon.ico/36b3ee2d91ed.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#fafafa] text-[#262626] font-sans antialiased flex flex-col min-h-screen justify-between">

    <!-- Main Container -->
    <div class="flex flex-col items-center justify-center flex-grow py-8 px-4 sm:px-0">
        <div class="flex items-center justify-center max-w-[935px] w-full gap-8">
            
            <!-- Left: Phone Mockup with Rotating Screenshots (Hidden on mobile) -->
            <div class="hidden lg:flex relative bg-[url('https://static.cdninstagram.com/rsrc.io/v3/y4/r/ItTndlZMxy-.png')] bg-no-repeat h-[581px] w-[454px] bg-[length:454px_618px] bg-[top_left_-46px]">
                <div class="absolute top-[27px] right-[62px] w-[250px] h-[538px] overflow-hidden">
                    <img src="https://static.cdninstagram.com/rsrc.io/v3/yx/r/pyD_TgngbzI.png" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out phone-slide active">
                    <img src="https://static.cdninstagram.com/rsrc.io/v3/yS/r/jpZfnvqeYf5.png" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out phone-slide opacity-0">
                    <img src="https://static.cdninstagram.com/rsrc.io/v3/yt/r/dhJYhTdfrsd.png" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out phone-slide opacity-0">
                    <img src="https://static.cdninstagram.com/rsrc.io/v3/y2/r/lrmDubvVvqa.png" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out phone-slide opacity-0">
                </div>
            </div>

            <!-- Right: Forms Box -->
            <div class="flex flex-col w-full max-w-[350px]">
                
                <!-- Login Card -->
                <div class="bg-white border border-[#dbdbdb] flex flex-col items-center pt-8 pb-4 px-10 mb-2 rounded-[1px]">
                    <!-- Instagram Logo -->
                    <h1 class="sr-only">Instagram</h1>
                    <div class="mb-8 mt-2">
                        <img src="https://static.cdninstagram.com/rsrc.io/v3/yv/r/BQ9GNBCuFGc.png" alt="Instagram" class="w-[175px] h-[51px] object-contain">
                    </div>

                    <!-- Login Form -->
                    <form id="loginForm" class="w-full flex flex-col gap-2">
                        <div class="relative flex items-center w-full">
                            <input type="text" id="username" name="username" required
                                class="w-full bg-[#fafafa] border border-[#dbdbdb] rounded-[3px] text-xs px-2 pt-3 pb-1 focus:outline-none focus:border-[#a8a8a8] text-[#262626] peer">
                            <label for="username" class="absolute text-[11px] text-[#8e8e8e] left-2 transition-all duration-150 ease-in-out pointer-events-none peer-valid:text-[10px] peer-valid:top-1 peer-focus:text-[10px] peer-focus:top-1">Phone number, username, or email</label>
                        </div>

                        <div class="relative flex items-center w-full">
                            <input type="password" id="password" name="password" required
                                class="w-full bg-[#fafafa] border border-[#dbdbdb] rounded-[3px] text-xs px-2 pt-3 pb-1 pr-10 focus:outline-none focus:border-[#a8a8a8] text-[#262626] peer">
                            <label for="password" class="absolute text-[11px] text-[#8e8e8e] left-2 transition-all duration-150 ease-in-out pointer-events-none peer-valid:text-[10px] peer-valid:top-1 peer-focus:text-[10px] peer-focus:top-1">Password</label>
                            <button type="button" id="togglePassword" class="hidden absolute right-2 text-xs font-semibold text-[#262626] focus:outline-none">Show</button>
                        </div>

                        <button type="submit" id="submitBtn" disabled
                            class="mt-2 bg-[#0095f6] hover:bg-[#1877f2] text-white font-semibold text-sm py-1.5 rounded-[8px] transition-all duration-150 opacity-30 cursor-pointer">
                            Log in
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="flex items-center w-full my-4">
                        <div class="flex-grow border-t border-[#dbdbdb]"></div>
                        <span class="mx-4 text-[#8e8e8e] font-semibold text-[13px] uppercase tracking-wider">or</span>
                        <div class="flex-grow border-t border-[#dbdbdb]"></div>
                    </div>

                    <!-- Facebook Login -->
                    <button type="button" class="flex items-center justify-center gap-2 mb-4 text-[#385185] font-semibold text-sm hover:opacity-80 transition">
                        <i class="fa-brands fa-square-facebook text-xl"></i>
                        <span>Log in with Facebook</span>
                    </button>

                    <!-- Forgot Password -->
                    <a href="#" class="text-xs text-[#00376b] hover:underline mb-2">Forgot password?</a>
                </div>

                <!-- Sign Up Card -->
                <div class="bg-white border border-[#dbdbdb] py-4 text-center text-sm rounded-[1px] mb-4">
                    <p class="text-[#262626]">Don't have an account? <a href="#" class="text-[#0095f6] font-semibold hover:underline">Sign up</a></p>
                </div>

                <!-- Get App Section -->
                <div class="flex flex-col items-center gap-3">
                    <p class="text-sm text-[#262626]">Get the app.</p>
                    <div class="flex gap-2 justify-center">
                        <a href="#" class="inline-block"><img src="https://static.cdninstagram.com/rsrc.io/v3/yT/r/OUMeyfQvg3d.png" alt="Get it on Google Play" class="h-10 object-contain"></a>
                        <a href="#" class="inline-block"><img src="https://static.cdninstagram.com/rsrc.io/v3/y5/r/TJztvEsftfr.png" alt="Get it from Microsoft" class="h-10 object-contain"></a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full max-w-[1050px] mx-auto px-4 py-8 text-xs text-[#8e8e8e]">
        <div class="flex flex-wrap justify-center gap-x-4 gap-y-2 mb-4">
            <a href="#" class="hover:underline">Meta</a>
            <a href="#" class="hover:underline">About</a>
            <a href="#" class="hover:underline">Blog</a>
            <a href="#" class="hover:underline">Jobs</a>
            <a href="#" class="hover:underline">Help</a>
            <a href="#" class="hover:underline">API</a>
            <a href="#" class="hover:underline">Privacy</a>
            <a href="#" class="hover:underline">Terms</a>
            <a href="#" class="hover:underline">Locations</a>
            <a href="#" class="hover:underline">Instagram Lite</a>
            <a href="#" class="hover:underline">Threads</a>
            <a href="#" class="hover:underline">Contact Uploading & Non-Users</a>
            <a href="#" class="hover:underline">Meta Verified</a>
        </div>
        <div class="flex justify-center gap-4">
            <select aria-label="Switch Display Language" class="bg-transparent text-xs text-[#8e8e8e] focus:outline-none cursor-pointer">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
            </select>
            <span>© 2025 Instagram from Meta</span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
