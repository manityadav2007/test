<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature in Motion | 3D Interactive Sanctuary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        .emerald-glow {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .emerald-glow:hover {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.7);
            transform: translateY(-2px);
        }
        .fade-in {
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="relative z-10 w-full h-full flex flex-col justify-between p-6 md:p-12 pointer-events-none">
        <header class="flex justify-between items-center max-w-7xl mx-auto w-full fade-in">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center backdrop-blur-md">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                    </svg>
                </div>
                <span class="text-white font-semibold text-lg tracking-wide">Verven Sanctuary</span>
            </div>
            <div class="pointer-events-auto">
                <button id="toggle-wind" class="glass-button text-xs font-medium text-emerald-300 px-4 py-2 rounded-full uppercase tracking-wider flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>Wind: Moderate</span>
                </button>
            </div>
        </header>

        <main class="max-w-4xl mx-auto text-center my-auto pointer-events-auto px-4 fade-in" style="animation-delay: 0.3s;">
            <div class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs font-semibold uppercase tracking-widest mb-6 backdrop-blur-md">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                <span>Generative 3D Experience</span>
            </div>
            
            <h1 class="text-5xl md:text-7xl font-bold text-white tracking-tight mb-6 leading-none">
                Nature in <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">Motion</span>
            </h1>
            
            <p class="text-gray-400 text-lg md:text-xl font-light max-w-2xl mx-auto mb-10 leading-relaxed">
                Experience seamless generative 3D environments on the web powered by procedural geometry and organic particle physics.
            </p>
            
            <div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-5">
                <button id="explore-btn" class="w-full sm:w-auto emerald-glow text-white font-medium px-8 py-4 rounded-xl text-base flex items-center justify-center space-x-3 cursor-pointer">
                    <span>Explore World</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
                <a href="https://github.com/manityadav2007/test" target="_blank" class="w-full sm:w-auto glass-button text-white font-medium px-8 py-4 rounded-xl text-base flex items-center justify-center space-x-3 cursor-pointer">
                    <span>View Source</span>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                </a>
            </div>
        </main>

        <footer class="flex flex-col sm:flex-row justify-between items-center max-w-7xl mx-auto w-full text-xs text-gray-500 space-y-2 sm:space-y-0 fade-in" style="animation-delay: 0.6s;">
            <p>© 2025 Verven Engineering. All rights reserved.</p>
            <div class="flex space-x-6">
                <span class="text-gray-400">Three.js r128</span>
                <span class="text-gray-400">Tailwind CSS</span>
                <span class="text-gray-400">WebGL 2.0</span>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
