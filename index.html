<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Authentication Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Sign In</h2>
      <p class="subtitle">Choose your preferred identity provider</p>
      
      <div class="social-buttons">
        <button class="btn btn-social btn-provider-a" onclick="handleOAuthRedirect('ProviderA')">
          Continue with Identity Provider A
        </button>
        <button class="btn btn-social btn-provider-b" onclick="handleOAuthRedirect('ProviderB')">
          Continue with Identity Provider B
        </button>
        <button class="btn btn-social btn-provider-c" onclick="handleOAuthRedirect('ProviderC')">
          Continue with Social Auth
        </button>
      </div>

      <div class="divider"><span>OR</span></div>

      <form id="loginForm" onsubmit="handleStandardLogin(event)">
        <div class="input-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>

      <div id="statusMessage" class="status-message"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
